<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>吴敏宝宝 ❤️</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#ff9ecf,#ffe5f0);
    font-family:"Microsoft YaHei";
    display:flex;
    justify-content:center;
    align-items:center;
}


.card{
    width:380px;
    padding:35px;
    background:rgba(255,255,255,.9);
    border-radius:30px;
    text-align:center;
    box-shadow:0 10px 40px rgba(255,0,120,.3);
    z-index:2;
    overflow:hidden;
}


.heart{
    font-size:55px;
    animation:beat 1s infinite;
}


@keyframes beat{
    50%{
        transform:scale(1.15);
    }
}


h1{
    color:#ff4d94;
    font-size:36px;
}


h2{
    color:#ff6699;
}


.info{
    color:#ff85ad;
    font-size:14px;
    line-height:24px;
}



.btn-box{
    height:120px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
}



button{
    border:none;
    border-radius:50px;
    cursor:pointer;
    transition:all .5s ease;
}



#yes{
    background:#ff4d94;
    color:white;
    width:110px;
    height:45px;
    font-size:20px;
    box-shadow:0 5px 20px rgba(255,0,100,.35);
}



#no{
    background:#ddd;
    color:#777;
    width:80px;
    height:40px;
    position:absolute;
}




/* 爱心雨 */

.fall{
    position:absolute;
    top:-50px;
    z-index:1;
    animation:fall linear forwards;
}


@keyframes fall{

    to{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }

}




/* 烟花 */

.firework{
    position:absolute;
    font-size:35px;
    animation:boom 1s forwards;
}


@keyframes boom{

    0%{
        transform:scale(.2);
    }

    100%{
        transform:scale(4);
        opacity:0;
    }

}

</style>

</head>


<body>


<div class="card">


<div class="heart">❤️</div>


<div class="info">
IP: 192.168.1.520<br>
LOCATION: MY HEART<br>
STATUS: LOVE FOUND
</div>



<h1>💗 吴敏宝宝 💗</h1>


<h2>我喜欢你</h2>

<h2>可不可以跟我在一起？</h2>



<div class="btn-box">

<button id="yes">YES ❤️</button>

<button id="no">NO 💔</button>

</div>


</div>




<script>


let yes=document.getElementById("yes");

let no=document.getElementById("no");


let scale=1;



// YES缓慢变大

yes.onclick=function(){


    scale+=0.08;


    if(scale<=1.7){

        yes.style.transform=
        "scale("+scale+")";

    }



    if(scale>1.6){


        document.querySelector(".card").innerHTML=

        `
        <div class="heart">💖</div>
        <h1>吴敏宝宝 ❤️</h1>
        <h2>表白成功！</h2>
        <h2>以后请多多指教 💕</h2>
        `;


        fireworks();

    }

}





// NO逃跑

no.onmouseover=function(){


    no.style.left=
    Math.random()*(window.innerWidth-100)+"px";


    no.style.top=
    Math.random()*(window.innerHeight-50)+"px";


}





// 爱心雨

function heartRain(){


    let h=document.createElement("div");


    h.className="fall";


    h.innerHTML=
    ["❤️","💗","💕","💖"]
    [Math.floor(Math.random()*4)];



    h.style.left=
    Math.random()*100+"vw";



    h.style.fontSize=
    (15+Math.random()*25)+"px";



    h.style.animationDuration=
    (3+Math.random()*3)+"s";



    document.body.appendChild(h);



    setTimeout(()=>{

        h.remove();

    },6000);


}


setInterval(heartRain,200);






// 烟花

function fireworks(){


    for(let i=0;i<50;i++){


        setTimeout(()=>{


            let f=document.createElement("div");


            f.className="firework";


            f.innerHTML=
            ["🎆","✨","💖"]
            [Math.floor(Math.random()*3)];



            f.style.left=
            Math.random()*100+"vw";



            f.style.top=
            Math.random()*80+"vh";



            document.body.appendChild(f);



            setTimeout(()=>{

                f.remove();

            },1000);



        },i*80);


    }


}



</script>


</body>
</html>
