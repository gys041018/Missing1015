<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>吴敏宝宝 ❤️</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:"Microsoft YaHei";
    background:linear-gradient(
        135deg,
        #ff9ecf,
        #ffd6e8,
        #ffc1dc
    );
    background-size:300% 300%;
    animation:bg 8s infinite;
}


@keyframes bg{

    50%{
        background-position:100% 100%;
    }

}



.card{

    width:350px;
    padding:35px;

    background:rgba(255,255,255,.75);

    backdrop-filter:blur(15px);

    border-radius:30px;

    text-align:center;

    box-shadow:
    0 20px 50px rgba(255,0,100,.3);

    z-index:2;

}



.heart{

    font-size:60px;

    animation:heart 1s infinite;

}



@keyframes heart{

    50%{
        transform:scale(1.2);
    }

}



h1{

    color:#ff3f8e;

}


h2{

    color:#ff6699;

}



.text{

    color:#ff6699;

    min-height:60px;

}




button{

    border:none;

    border-radius:40px;

    padding:12px 30px;

    margin:15px;

    font-size:20px;

    cursor:pointer;

}



#yes{

    background:#ff4d94;

    color:white;

    transition:.5s;

}



#no{

    background:#ddd;

    position:absolute;

}





/* 爱心 */

.love{

    position:absolute;

    top:-50px;

    animation:fall 5s linear forwards;

}


@keyframes fall{

    to{

        transform:
        translateY(110vh)
        rotate(360deg);

        opacity:0;

    }

}




/* 烟花 */

.fire{

    position:absolute;

    font-size:35px;

    animation:boom 1s forwards;

}


@keyframes boom{

    from{

        transform:scale(.2);

    }

    to{

        transform:scale(5);

        opacity:0;

    }

}



</style>


</head>


<body>



<div class="card">


<div class="heart">
❤️
</div>


<h1>
💗 吴敏宝宝 💗
</h1>



<div class="text" id="text">

</div>



<button id="yes">
YES ❤️
</button>


<button id="no">
NO 💔
</button>


</div>




<script>


// 打字效果

let words=
"遇见你之后，世界变得更加温柔。\n我喜欢你，可不可以跟我在一起？";

let index=0;


function typing(){

    if(index<words.length){

        document.getElementById("text")
        .innerHTML+=words[index]
        .replace("\n","<br>");

        index++;

        setTimeout(typing,120);

    }

}

typing();




// YES变大


let yes=document.getElementById("yes");

let scale=1;


yes.onclick=function(){


    scale+=0.08;


    if(scale<1.8){

        yes.style.transform=
        "scale("+scale+")";

    }



    if(scale>=1.7){


        document.querySelector(".card")
        .innerHTML=

        `
        <div class="heart">
        💖
        </div>

        <h1>
        吴敏宝宝 ❤️
        </h1>

        <h2>
        表白成功！
        </h2>

        <p>
        以后请多多指教💕
        </p>

        `;


        fireworks();

    }

}




// NO逃跑


let no=document.getElementById("no");


no.onmouseover=function(){

    no.style.left=
    Math.random()*80+"vw";


    no.style.top=
    Math.random()*80+"vh";

}





// 爱心雨


setInterval(()=>{


    let love=document.createElement("div");

    love.className="love";


    love.innerHTML=
    ["❤️","💗","💕","💖"]
    [Math.floor(Math.random()*4)];


    love.style.left=
    Math.random()*100+"vw";


    love.style.fontSize=
    20+Math.random()*20+"px";


    document.body.appendChild(love);


    setTimeout(()=>{

        love.remove();

    },5000);



},200);





// 烟花


function fireworks(){


for(let i=0;i<60;i++){


setTimeout(()=>{


let f=document.createElement("div");


f.className="fire";


f.innerHTML=
["🎆","✨","💖"]
[Math.floor(Math.random()*3)];



f.style.left=
Math.random()*100+"vw";


f.style.top=
Math.random()*80+"vh";



document.body.appendChild(f);



setTimeout(()=>{

f.remove();

},1000);



},i*80);


}


}



</script>


</body>

</html>
